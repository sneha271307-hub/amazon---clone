<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="styles/shared/general.css">
  <link rel="stylesheet" href="styles/pages/checkout/checkout-header.css">
  <link rel="stylesheet" href="styles/pages/checkout/checkout.css">
</head>

<body>

  <!-- Checkout Header -->
  <header class="checkout-header">
    <div class="header-content">

      <div class="checkout-header-left-section">
        <a href="index.html">
          <img
            class="amazon-logo"
            src="images/amazon-logo.png"
            alt="Amazon"
          >

          <img
            class="amazon-mobile-logo"
            src="images/amazon-mobile-logo.png"
            alt="Amazon"
          >
        </a>
      </div>

      <div class="checkout-header-middle-section">
        Checkout
        (<a class="return-to-home-link" href="index.html">
          <span class="js-checkout-item-count">0</span> items
        </a>)
      </div>

      <div class="checkout-header-right-section">
        <img
          src="images/icons/checkout-lock-icon.png"
          alt="Secure checkout"
        >
      </div>

    </div>
  </header>


  <!-- Main Checkout -->
  <main class="main">

    <div class="page-title">
      Review your order
    </div>

    <div class="checkout-grid">

      <!-- Cart products are generated by order.summary.js -->
      <div class="order-summary js-order-summary">
      </div>

      <!-- Payment summary is generated by payment.summary.js -->
      <div class="payment-summary js-payment-summary">
      </div>

    </div>

  </main>


  <!-- JavaScript -->
  <script
    type="module"
    src="backend/scripts/checkout.js"
  ></script>

</body>

</html>
